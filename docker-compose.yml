services:
  collision-detector:
    build: .
    image: kruel1/bigdata_task_final:1.0
    container_name: bigdata_task_final
    volumes:
      - ./data:/data:ro
      - ./output:/app/output
    # Increase memory if running the full month — Spark defaults are stingy
    environment:
      - SPARK_DRIVER_MEMORY=8g
    command: ["--input", "/data", "--output", "/app/output"]
